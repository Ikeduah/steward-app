# Alembic configuration for the Steward API.
#
# The database URL is NOT stored here. It is resolved at runtime in
# alembic/env.py from DATABASE_URL_UNPOOLED (preferred) or DATABASE_URL.
# Run migrations externally before deploying, e.g.:
#   cd steward/api
#   DATABASE_URL_UNPOOLED=postgres://... alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Leave sqlalchemy.url blank — env.py sets it from the environment.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
