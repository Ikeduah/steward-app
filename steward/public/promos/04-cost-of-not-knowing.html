<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Steward — The Cost of Not Knowing</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; overflow: hidden; }
  body { font-family: 'Inter', system-ui, sans-serif; }
  #root { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="root" data-video-root data-screen-label="t=0s"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="brand.jsx"></script>

<script type="text/babel">
const B = StewardBrand;

/* ============ SCENE A · COLD OPEN (0 → 4) ============ */
function SceneA() {
  return (
    <Sprite start={0} end={4}>
      {({ localTime, duration }) => {
        const t = Easing.easeOutCubic(clamp(localTime/0.6, 0, 1));
        const outT = clamp((localTime - (duration-0.5))/0.5, 0, 1);
        const op = (1 - outT) * t;
        // ticker counter — global "burning money" sense (anchored, illustrative)
        const countT = clamp((localTime - 0.6)/2.4, 0, 1);
        const e = Easing.easeOutCubic(countT);
        const val = Math.round(47820 * e);
        return (
          <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center', opacity:op, gap:36}}>
            <Eyebrow color={B.amber} size={18}>The hidden cost of asset chaos</Eyebrow>
            <div style={{fontFamily:B.display, fontWeight:500, fontSize:48, color:B.n300, letterSpacing:'-0.02em', textAlign:'center', maxWidth:1200, lineHeight:1.25}}>
              The average mid-size org loses this much<br/>per year to assets they can't account for:
            </div>
            <div style={{
              fontFamily:B.display, fontWeight:700, fontSize:200, color:B.amber,
              letterSpacing:'-0.045em', lineHeight:1, fontVariantNumeric:'tabular-nums',
              filter:`drop-shadow(0 0 40px ${B.amber}55)`,
            }}>
              ${val.toLocaleString()}
            </div>
            <div style={{fontFamily:B.mono, fontSize:12, color:B.n500, letterSpacing:'0.18em', textTransform:'uppercase'}}>
              Illustrative · industry blend · 200+ tracked assets
            </div>
          </div>
        );
      }}
    </Sprite>
  );
}

/* ============ SCENE B · WHERE IT GOES (4 → 12) ============ */
function CostCard({ label, sub, value, delay, accent, total }) {
  const { localTime } = useSprite();
  const op = Easing.easeOutCubic(clamp((localTime - delay)/0.5, 0, 1));
  const tx = (1 - op) * 50;
  const countT = clamp((localTime - delay - 0.2)/1.4, 0, 1);
  const e = Easing.easeOutCubic(countT);
  const v = Math.round(value * e);
  // bar fill
  const barT = clamp((localTime - delay - 0.5)/1.0, 0, 1);
  const barW = Easing.easeOutCubic(barT) * (value / total) * 100;

  return (
    <div style={{
      opacity:op, transform:`translateX(${tx}px)`,
      background:'rgba(255,255,255,0.025)', border:'1px solid rgba(255,255,255,0.08)',
      borderRadius:16, padding:'22px 26px',
      display:'flex', alignItems:'center', gap:24,
    }}>
      <div style={{flex:'0 0 360px'}}>
        <div style={{fontFamily:B.display, fontWeight:600, fontSize:22, color:'#fff', letterSpacing:'-0.015em'}}>{label}</div>
        <div style={{fontFamily:B.body, fontSize:14, color:B.n400, marginTop:4}}>{sub}</div>
      </div>
      <div style={{flex:1, height:14, background:'rgba(255,255,255,0.05)', borderRadius:7, overflow:'hidden', position:'relative'}}>
        <div style={{height:'100%', width:`${barW}%`, background:accent, borderRadius:7, transition:'width 0.05s linear'}}/>
      </div>
      <div style={{
        fontFamily:B.display, fontWeight:600, fontSize:36, color:accent,
        letterSpacing:'-0.02em', fontVariantNumeric:'tabular-nums', minWidth:170, textAlign:'right',
      }}>
        ${v.toLocaleString()}
      </div>
    </div>
  );
}

function SceneB() {
  return (
    <Sprite start={4} end={12}>
      {({ localTime, duration }) => {
        const outT = clamp((localTime - (duration-0.5))/0.5, 0, 1);
        const op = (1 - outT);
        const titleT = Easing.easeOutCubic(clamp(localTime/0.5, 0, 1));
        return (
          <div style={{position:'absolute',inset:0, opacity:op, display:'flex', flexDirection:'column', justifyContent:'center', padding:'0 140px'}}>
            <div style={{opacity:titleT, transform:`translateY(${(1-titleT)*16}px)`, marginBottom:56}}>
              <div style={{fontFamily:B.mono, fontSize:14, color:B.amber, letterSpacing:'0.22em', textTransform:'uppercase', marginBottom:18}}>Where the money goes</div>
              <div style={{fontFamily:B.display, fontWeight:600, fontSize:84, color:'#fff', letterSpacing:'-0.04em', lineHeight:1}}>
                Four silent leaks.
              </div>
            </div>
            <div style={{display:'flex', flexDirection:'column', gap:14}}>
              <CostCard delay={0.4} accent={B.red}   label="Lost & unaccounted assets"     sub="Gear that walks off, never logged"           value={18400} total={47820}/>
              <CostCard delay={0.9} accent={B.amber} label="Last-minute rentals"            sub="When you can't find what you own"             value={12600} total={47820}/>
              <CostCard delay={1.4} accent={B.blue}  label="Premature replacement"          sub="Buying duplicates of gear you have"           value={9200}  total={47820}/>
              <CostCard delay={1.9} accent={B.n400}  label="Labor · search & reconcile"     sub="Hours hunting down equipment every week"     value={7620}  total={47820}/>
            </div>
          </div>
        );
      }}
    </Sprite>
  );
}

/* ============ SCENE C · TURN IT AROUND (12 → 17) ============ */
function SceneC() {
  return (
    <Sprite start={12} end={17}>
      {({ localTime, duration }) => {
        const outT = clamp((localTime - (duration-0.5))/0.5, 0, 1);
        const op = (1 - outT);

        // Transition: the amber number above flips to emerald and shrinks the cost
        const t = Easing.easeOutCubic(clamp(localTime/0.5, 0, 1));
        const countT = clamp((localTime - 0.6)/2.2, 0, 1);
        const e = Easing.easeOutCubic(countT);
        // Annual savings (~80% of leak)
        const target = 38256;
        const val = Math.round(target * e);

        return (
          <div style={{position:'absolute',inset:0, opacity:op, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:36}}>
            <div style={{opacity:t, transform:`translateY(${(1-t)*16}px)`}}>
              <Eyebrow color={B.g400} size={18}>With Steward</Eyebrow>
            </div>
            <div style={{
              fontFamily:B.display, fontWeight:500, fontSize:54, color:'#fff', letterSpacing:'-0.025em', textAlign:'center', maxWidth:1300, lineHeight:1.2,
            }}>
              Stop the leaks. Recover your gear.<br/>Save the average org:
            </div>
            <div style={{
              fontFamily:B.display, fontWeight:700, fontSize:220, color:B.g400,
              letterSpacing:'-0.05em', lineHeight:1, fontVariantNumeric:'tabular-nums',
              filter:`drop-shadow(0 0 60px ${B.g500}77)`,
            }}>
              ${val.toLocaleString()}<span style={{fontSize:60, color:B.n300, fontWeight:500}}>/yr</span>
            </div>
            <div style={{fontFamily:B.mono, fontSize:13, color:B.n400, letterSpacing:'0.18em', textTransform:'uppercase', textAlign:'center', maxWidth:900, lineHeight:1.6}}>
              80% loss reduction · industry benchmark · 200+ asset orgs
            </div>
          </div>
        );
      }}
    </Sprite>
  );
}

/* ============ SCENE D · THREE MULTIPLIERS (17 → 24) ============ */
function MultCard({ icon, headline, subline, delay, accent }) {
  const { localTime } = useSprite();
  const t = Easing.easeOutCubic(clamp((localTime - delay)/0.6, 0, 1));
  const op = t;
  const ty = (1 - t) * 30;
  return (
    <div style={{
      opacity:op, transform:`translateY(${ty}px)`,
      background:'rgba(255,255,255,0.025)', border:'1px solid rgba(255,255,255,0.08)',
      borderRadius:20, padding:'36px 32px', display:'flex', flexDirection:'column', gap:18, flex:1, height:380,
    }}>
      <div style={{width:64, height:64, borderRadius:16, background:accent + '20', display:'flex', alignItems:'center', justifyContent:'center', color:accent}}>
        {icon}
      </div>
      <div style={{fontFamily:B.display, fontWeight:600, fontSize:60, color:'#fff', letterSpacing:'-0.04em', lineHeight:0.95, marginTop:'auto'}}>
        {headline}
      </div>
      <div style={{fontFamily:B.display, fontWeight:400, fontSize:18, color:B.n400, letterSpacing:'-0.005em', lineHeight:1.45}}>
        {subline}
      </div>
    </div>
  );
}

function SceneD() {
  return (
    <Sprite start={17} end={24}>
      {({ localTime, duration }) => {
        const outT = clamp((localTime - (duration-0.5))/0.5, 0, 1);
        const op = (1 - outT);
        const titleT = Easing.easeOutCubic(clamp(localTime/0.5, 0, 1));
        return (
          <div style={{position:'absolute',inset:0, opacity:op, display:'flex', flexDirection:'column', justifyContent:'center', padding:'0 120px', gap:60}}>
            <div style={{opacity:titleT, transform:`translateY(${(1-titleT)*16}px)`}}>
              <div style={{fontFamily:B.mono, fontSize:14, color:B.g400, letterSpacing:'0.22em', textTransform:'uppercase', marginBottom:18}}>Compound returns</div>
              <div style={{fontFamily:B.display, fontWeight:600, fontSize:80, color:'#fff', letterSpacing:'-0.04em', lineHeight:1}}>
                And the rest <span style={{color:B.g400}}>pays you back.</span>
              </div>
            </div>
            <div style={{display:'flex', gap:24}}>
              <MultCard delay={0.4} accent={B.g400}
                icon={<svg width="32" height="32" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="2"/><path d="M12 7v6l3 2" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>}
                headline="90% less time" subline="Spent finding gear, reconciling spreadsheets, and chasing emails."/>
              <MultCard delay={0.7} accent={B.blue}
                icon={<svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                headline="2× faster turnarounds" subline="Crew shows up, scans, checks out. Back to work in seconds."/>
              <MultCard delay={1.0} accent={B.g400}
                icon={<svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M12 2 L20 6 V12 C20 17 16 21 12 22 C8 21 4 17 4 12 V6 Z" stroke="currentColor" strokeWidth="2" strokeLinejoin="round"/><path d="M9 12 L11 14 L15 10" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                headline="100% audit-ready" subline="A full chain of custody on every asset. No more scrambling at audit time."/>
            </div>
          </div>
        );
      }}
    </Sprite>
  );
}

/* ============ SCENE E · END CARD (24 → 28) ============ */
function SceneE() {
  return (
    <Sprite start={24} end={28}>
      {({ localTime }) => {
        const t = Easing.easeOutCubic(clamp(localTime/0.6, 0, 1));
        return (
          <div style={{position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', opacity:t, transform:`translateY(${(1-t)*16}px)`, gap:36}}>
            <StewardLockup tileSize={120} wordSize={84}/>
            <div style={{
              fontFamily:B.display, fontWeight:500, fontSize:54, color:'#fff', letterSpacing:'-0.03em',
              textAlign:'center', maxWidth:1100, lineHeight:1.2,
            }}>
              Account for every asset.<br/>
              <span style={{color:B.g400}}>Stop paying for ones you can't find.</span>
            </div>
            <div style={{fontFamily:B.mono, fontSize:14, color:B.g400, letterSpacing:'0.18em', textTransform:'uppercase', marginTop:8}}>steward.app · Book a demo</div>
          </div>
        );
      }}
    </Sprite>
  );
}

/* ============ MAIN ============ */
function Promo04() {
  return (
    <Stage width={1920} height={1080} duration={28} background={B.ink} persistKey="promo-04">
      <TimestampLabel/>
      <div style={{position:'absolute', inset:0, overflow:'hidden', pointerEvents:'none'}}>
        <EmeraldGlow x="-15%" y="-10%" size="55%" intensity={0.16} blur={150}/>
        <EmeraldGlow x="60%"  y="60%" size="55%" intensity={0.14} blur={150}/>
        <GridBg opacity={0.5} size={90}/>
      </div>

      <SceneA/>
      <SceneB/>
      <SceneC/>
      <SceneD/>
      <SceneE/>

      <Sprite start={4} end={24}>
        {({ localTime }) => {
          const op = Easing.easeOutCubic(clamp(localTime/0.5, 0, 1)) * 0.75;
          return (
            <div style={{position:'absolute', top:48, left:60, opacity:op, display:'flex', alignItems:'center', gap:14}}>
              <KeystoneTile size={40} radius={10} glow={false}/>
              <span style={{fontFamily:B.display, fontWeight:600, fontSize:22, color:'#fff', letterSpacing:'-0.02em'}}>Steward</span>
            </div>
          );
        }}
      </Sprite>
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Promo04/>);
</script>
</body>
</html>
