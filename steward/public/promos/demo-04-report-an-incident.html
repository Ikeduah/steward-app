<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Steward — Demo · Report an Incident</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>html,body{margin:0;padding:0;height:100%;background:#0a0a0a;overflow:hidden}body{font-family:Inter,system-ui,sans-serif}#root{position:absolute;inset:0}</style>
</head>
<body>
<div id="root" data-video-root data-screen-label="t=0s"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="brand.jsx"></script>
<script type="text/babel" src="steward-ui.jsx"></script>

<script type="text/babel">
const B = StewardBrand;
const SHELL_X = 120, SHELL_Y = 80;

function Cold() {
  return (
    <Sprite start={0} end={3}>
      {({ localTime, duration }) => {
        const t = Easing.easeOutCubic(clamp(localTime/0.6, 0, 1));
        const out = clamp((localTime - (duration-0.5))/0.5, 0, 1);
        const op = (1 - out) * t;
        return (
          <div style={{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center', opacity:op, gap:30}}>
            <div style={{fontFamily:B.mono, fontSize:14, color:B.amber, letterSpacing:'0.26em', textTransform:'uppercase', display:'flex', alignItems:'center', gap:14}}>
              <span style={{width:36, height:1.5, background:B.amber}}/>Demo · 04<span style={{width:36, height:1.5, background:B.amber}}/>
            </div>
            <div style={{fontFamily:B.display, fontWeight:600, fontSize:140, color:'#fff', letterSpacing:'-0.045em', lineHeight:0.95, textAlign:'center'}}>Report an Incident</div>
            <div style={{fontFamily:B.display, fontWeight:400, fontSize:28, color:B.n300}}>Something broken? Don't lose track of it.</div>
          </div>
        );
      }}
    </Sprite>
  );
}

const cursor = [
  { t: 4.0,  x: 1720, y: 200, click: true },     // + New Ticket
  { t: 6.5,  x: 1080, y: 360, click: true },     // pick asset
  { t: 9.0,  x: 1080, y: 480 },                  // priority HIGH
  { t: 9.5,  x: 1080, y: 480, click: true },
  { t: 12.0, x: 1080, y: 640 },                  // description (typing)
  { t: 14.5, x: 1340, y: 820, click: true },     // submit
];

function Walk() {
  return (
    <Sprite start={3} end={23}>
      {({ localTime, duration }) => {
        const ent = Easing.easeOutCubic(clamp(localTime/0.8, 0, 1));
        const shellOp = ent, shellY = (1-ent)*40;

        // Modal opens at 1.2s
        const modalT = clamp((localTime - 1.2)/0.5, 0, 1);
        const modalOp = Easing.easeOutCubic(modalT);

        // Asset picker hover at 2.5, click at 3.5
        const f1 = Easing.easeOutCubic(clamp((localTime - 1.8)/0.5, 0, 1));
        const f2 = Easing.easeOutCubic(clamp((localTime - 4.0)/0.5, 0, 1));
        const f3 = Easing.easeOutCubic(clamp((localTime - 5.5)/0.5, 0, 1));
        const f4 = Easing.easeOutCubic(clamp((localTime - 7.5)/0.5, 0, 1));

        // priority chip selected at 6.5
        const sel = localTime >= 6.5 ? 'HIGH' : (localTime >= 5.6 ? 'MED' : null);

        // typing description at 8s
        const descText = 'The tightening knob on the yoke is stripped and won\'t lock.';
        const descTyped = descText.slice(0, Math.floor(clamp((localTime - 8.0)/3.0, 0, 1) * descText.length));
        const isTypingDesc = localTime > 8.0 && localTime < 11.0;

        // submit at 11.5
        const successT = clamp((localTime - 11.5)/0.5, 0, 1);
        const closeT = clamp((localTime - 13.0)/0.5, 0, 1);
        const modalOut = 1 - closeT;

        // Incident card slides in at 14s
        const newTicketT = Easing.easeOutCubic(clamp((localTime - 14.0)/0.6, 0, 1));

        const captions = [
          { from: 0.6, to: 4.5,  text: 'Click + New Ticket to flag a problem' },
          { from: 4.5, to: 7.0,  text: 'Pick the affected asset · select priority' },
          { from: 7.0, to: 11.5, text: 'Describe what happened · attach photos if needed' },
          { from: 11.5, to: 14.5, text: '✓ Ticket opened · asset auto-marked Maintenance' },
          { from: 14.5, to: 19.0, text: 'Ops sees it instantly · repair queue updated' },
        ];
        const cap = captions.find(c => localTime >= c.from && localTime < c.to);
        const capT = cap ? Easing.easeOutCubic(clamp((localTime - cap.from)/0.3, 0, 1)) * Easing.easeOutCubic(clamp((cap.to - localTime)/0.3, 0, 1)) : 0;

        return (
          <div style={{position:'absolute', inset:0}}>
            <div style={{position:'absolute', left:SHELL_X, top:SHELL_Y, width:1680, height:920, opacity:shellOp, transform:`translateY(${shellY}px)`}}>
              <AppShell active="incidents">
                <div style={{display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:32}}>
                  <div style={{display:'flex', alignItems:'center', gap:14}}>
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke={B.red} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.3 4l-8 14a2 2 0 0 0 1.7 3h16a2 2 0 0 0 1.7-3l-8-14a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
                    <div>
                      <div style={{fontFamily:B.display, fontWeight:700, fontSize:42, color:B.ink, letterSpacing:'-0.025em', marginBottom:6}}>Incident Tracking</div>
                      <p style={{fontFamily:B.body, fontSize:16, color:B.n500}}>Manage asset issues and repair tickets.</p>
                    </div>
                  </div>
                  <PrimaryButton highlight={localTime > 0.6 && localTime < 1.3}>New Ticket</PrimaryButton>
                </div>
                <div style={{display:'flex', gap:14, marginBottom:24}}>
                  <SearchBar placeholder="Search tickets..."/>
                  <FilterDropdown value="All Status"/>
                </div>
                {/* Incident list */}
                <div style={{display:'flex', flexDirection:'column', gap:14}}>
                  {newTicketT > 0 && (
                    <IncidentCard t={newTicketT} priority="HIGH" title="Broken Yoke Mount"
                      desc="The tightening knob on the yoke is stripped and won't lock."
                      asset="Aputure 600d Pro Light" date="6/2/2026"/>
                  )}
                  <IncidentCard priority="MEDIUM" title="Battery Door Latch Loose"
                    desc="Latch closes but doesn't fully click. Could pop open mid-use."
                    asset="Sony FX3 Cinema Camera" date="5/30/2026"/>
                </div>
              </AppShell>
            </div>

            {/* Modal */}
            {modalOp > 0 && modalOut > 0 && (
              <div style={{position:'absolute', left:SHELL_X, top:SHELL_Y, width:1680, height:920, opacity:modalOp*modalOut}}>
                <Modal title="Open Incident Ticket" t={modalOp*modalOut} width={760}>
                  {/* Asset picker */}
                  <div style={{opacity:f1, transform:`translateY(${(1-f1)*8}px)`, marginBottom:18}}>
                    <div style={{fontFamily:B.mono, fontSize:11, color:B.n400, letterSpacing:'0.14em', textTransform:'uppercase', marginBottom:7, fontWeight:600}}>Affected Asset</div>
                    <div style={{background:B.n50, border:'1.5px solid '+B.n100, borderRadius:10, padding:'13px 16px', display:'flex', alignItems:'center', gap:10}}>
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={B.n500} strokeWidth="2" strokeLinejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/></svg>
                      <span style={{fontFamily:B.body, fontSize:15, color:B.ink, fontWeight:500}}>Aputure 600d Pro Light</span>
                      <span style={{fontFamily:B.mono, fontSize:11.5, color:B.n400, marginLeft:'auto', letterSpacing:'0.06em'}}>QR-LGT-600D</span>
                    </div>
                  </div>
                  {/* Title */}
                  <div style={{opacity:f2, transform:`translateY(${(1-f2)*8}px)`, marginBottom:18}}>
                    <div style={{fontFamily:B.mono, fontSize:11, color:B.n400, letterSpacing:'0.14em', textTransform:'uppercase', marginBottom:7, fontWeight:600}}>Issue Title</div>
                    <div style={{background:B.n50, border:'1.5px solid '+B.n100, borderRadius:10, padding:'13px 16px', fontFamily:B.body, fontSize:15, color:B.ink, fontWeight:500}}>
                      Broken Yoke Mount
                    </div>
                  </div>
                  {/* Priority chips */}
                  <div style={{opacity:f3, transform:`translateY(${(1-f3)*8}px)`, marginBottom:18}}>
                    <div style={{fontFamily:B.mono, fontSize:11, color:B.n400, letterSpacing:'0.14em', textTransform:'uppercase', marginBottom:7, fontWeight:600}}>Priority</div>
                    <div style={{display:'flex', gap:10}}>
                      {[
                        { v:'LOW',      bg:'#E0F2EA',  fg:B.g700 },
                        { v:'MED',      bg:'#FFF3DC',  fg:B.amber },
                        { v:'HIGH',     bg:'#FFE2B8',  fg:'#B45309' },
                        { v:'CRITICAL', bg:'#FFDDDA',  fg:B.red },
                      ].map(c => (
                        <div key={c.v} style={{
                          background: sel === c.v ? c.bg : '#fff',
                          border: sel === c.v ? `2px solid ${c.fg}` : '1px solid '+B.n200,
                          color: sel === c.v ? c.fg : B.n500,
                          padding:'10px 18px', borderRadius:10, fontFamily:B.body, fontSize:13, fontWeight:700, letterSpacing:'0.04em',
                          boxShadow: sel === c.v ? `0 0 0 4px ${c.fg}22` : 'none',
                          transition:'all 0.15s',
                        }}>{c.v}</div>
                      ))}
                    </div>
                  </div>
                  {/* Description */}
                  <div style={{opacity:f4, transform:`translateY(${(1-f4)*8}px)`, marginBottom:24}}>
                    <div style={{fontFamily:B.mono, fontSize:11, color:B.n400, letterSpacing:'0.14em', textTransform:'uppercase', marginBottom:7, fontWeight:600}}>Description</div>
                    <div style={{background:B.n50, border:'1.5px solid '+(isTypingDesc ? B.g400 : B.n100), borderRadius:10, padding:'13px 16px', fontFamily:B.body, fontSize:15, color:B.ink, minHeight:80, lineHeight:1.5, transition:'border 0.2s'}}>
                      {descTyped}{isTypingDesc && <span style={{color:B.g500}}>|</span>}
                    </div>
                  </div>
                  <div style={{marginTop:8, display:'flex', justifyContent:'flex-end', gap:12}}>
                    <div style={{fontFamily:B.body, fontSize:15, fontWeight:600, color:B.n500, padding:'12px 22px'}}>Cancel</div>
                    <div style={{
                      background: successT > 0.4 ? B.red : B.ink, color:'#fff', fontFamily:B.body, fontSize:15, fontWeight:600,
                      padding:'12px 22px', borderRadius:12, display:'inline-flex', alignItems:'center', gap:10,
                      boxShadow: localTime > 11.0 && localTime < 11.9 ? `0 0 0 4px ${B.amber}55` : 'none',
                      transition:'all 0.25s',
                    }}>{successT > 0.4 ? '✓ Ticket Opened' : 'Open Ticket'}</div>
                  </div>
                </Modal>
              </div>
            )}

            {cap && (
              <div style={{position:'absolute', bottom:40, left:0, right:0, display:'flex', justifyContent:'center', opacity:capT, transform:`translateY(${(1-capT)*12}px)`}}>
                <div style={{background:'rgba(6,20,14,0.85)', backdropFilter:'blur(20px)', border:'1px solid rgba(245,158,11,0.35)', borderRadius:999, padding:'12px 24px', display:'flex', alignItems:'center', gap:14}}>
                  <div style={{width:8, height:8, borderRadius:'50%', background:B.amber, boxShadow:`0 0 12px ${B.amber}`}}/>
                  <span style={{fontFamily:B.display, fontWeight:500, fontSize:20, color:'#fff', letterSpacing:'-0.01em'}}>{cap.text}</span>
                </div>
              </div>
            )}
            <Cursor script={cursor}/>
          </div>
        );
      }}
    </Sprite>
  );
}

function End() { return <Sprite start={23} end={27}><EndCard tagline="Catch issues before they cost you." url="steward.app"/></Sprite>; }

function Demo() {
  return (
    <Stage width={1920} height={1080} duration={27} background={B.ink} persistKey="demo-04">
      <TimestampLabel/>
      <PromoBackdrop/>
      <CornerWatermark start={3.5} end={23}/>
      <Cold/><Walk/><End/>
    </Stage>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
